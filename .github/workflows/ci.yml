name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RUN_MYSQL_INTEGRATION: "1"
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_TEST_USER: library_test_app
      MYSQL_TEST_PASSWORD: test-app-password
      PIP_CONSTRAINT: requirements-ci.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
